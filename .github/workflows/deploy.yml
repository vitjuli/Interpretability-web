name: Deploy research dashboards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all six dashboards
        run: python3 site-hub/build.py
      - name: Install browser checks
        run: |
          npm install --prefix /tmp/research-qa --no-save --package-lock=false playwright@1.64.1
          /tmp/research-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check dashboard navigation and data loading
        env:
          PLAYWRIGHT_MODULE: /tmp/research-qa/node_modules/playwright/index.mjs
        run: node site-hub/browser-check.mjs
      - name: Save browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-checks
          path: site-hub/check-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
